        await test('a config disabled by another tab is rejected before a main request starts',async()=>{
            app.startNewChat();await st.executionSettingsReady;
            await app.setCurrentChatModelRef({apiConfigId:'gem',modelName:'gemini-3-pro-preview'});
            const configs=structuredClone(st.apiConfigs);await db.saveSetting('apiConfigs',configs.map(c=>c.id==='gem'?{...c,enabled:false}:c));
            const alerts=[];const alert=ui.showCustomAlert;ui.showCustomAlert=async message=>alerts.push(message);
            let fetched=false;window.fetch=async()=>{fetched=true;throw new Error('request must not start')};
            el.userInput.value='disabled';await app.handleSend();assert(!fetched);assert(alerts.length===1);assert(!st.isSending);
            ui.showCustomAlert=alert;window.fetch=rawFetch;await db.saveSetting('apiConfigs',configs);await app.refreshExecutionApiConfigsV136();
        });
        await test('non-streaming stop reaches the request signal and persists only the new user message',async()=>{
            const previous=JSON.stringify((await db.getSetting('lastSuccessfulExecution')).value);
            const before=st.currentMessages.length;
            st.abortController=null;st.settings.enableAutoRetry=false;
            window.fetch=async(url,opts)=>new Promise((resolve,reject)=>{opts.signal.addEventListener('abort',()=>reject(new DOMException('cancelled','AbortError')),{once:true});setTimeout(()=>app.abortRequest(),0);});
            el.userInput.value='cancel';await app.handleSend();eq(JSON.stringify((await db.getSetting('lastSuccessfulExecution')).value),previous);
            eq(st.currentMessages.slice(before).map(m=>m.role),['user']);
            eq((await db.getChat(st.currentChatId)).messages.slice(before).map(m=>m.role),['user']);
            assert(!st.isSending && st.abortController===null && st.sendExecutionV136===null);window.fetch=rawFetch;
        });
        await test('old chat imported after migration gets independent settings without changing history metadata',async()=>{
            await new Promise((resolve,reject)=>{const tx=st.db.transaction('chats','readwrite');tx.objectStore('chats').put({id:999,title:'late legacy',messages:[{role:'model',content:'old',thinkingBudget:4096,usageMetadata:{tmExecution:oldMetadata}}],createdAt:2,updatedAt:2});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
            await app.loadChat(999);eq(app.getCurrentChatModelRef(),{apiConfigId:'gem',modelName:'gemini-3-pro-preview'});
            eq(app.getCurrentChatThinkingEffort(),null);eq((await db.getChat(999)).messages[0].usageMetadata.tmExecution,oldMetadata);
            eq((await db.getChat(999)).messages[0].thinkingBudget,4096);
        });
        await test('non-streaming generation finishes on its source chat after switching to another chat and screen',async()=>{
            app.startNewChat();await st.executionSettingsReady;await app.setCurrentChatModelRef({apiConfigId:'gem',modelName:'gemini-3-pro-preview'});
            Object.assign(st.settings,{enableAutoRetry:false,enableStreamingOutput:false,enableMemory:false,enableProofreading:false});
            let requestReady, reply;
            const requestStarted=new Promise(resolve=>requestReady=resolve);
            window.fetch=async(url,opts)=>new Promise(resolve=>{reply=resolve;requestReady(opts.signal);});
            el.userInput.value='switch during request';
            const sending=app.handleSend();
            const signal=await requestStarted, sourceId=st.currentChatId;
            const targetBefore=await db.getChat(100);
            try {
                assert((await app.loadChat(100)).ok);
                await ui.showScreen('settings',true);
                assert(!signal.aborted && !st.isSending && !el.userInput.disabled);
                reply(Response.json({candidates:[{content:{parts:[{text:'saved only in the source'}]},finishReason:'STOP'}]}));
                await sending;
                eq(st.currentChatId,100);
                eq((await db.getChat(100)).messages,targetBefore.messages);
                eq((await db.getChat(sourceId)).messages.map(m=>m.content),['switch during request','saved only in the source']);
                assert((await app.loadChat(sourceId)).ok);
                eq(st.currentMessages.at(-1).content,'saved only in the source');
                assert(!st.isSending && !st.sendJobsV136.size);
            } finally {
                reply(Response.json({candidates:[]}));
                await sending;
                await ui.showScreen('chat',true);
                window.fetch=rawFetch;
            }
        });
        if(new URLSearchParams(location.search).has('review')) {
            output.push(...await window.runReviewRegressionsV136({app,db,st,ui,el,assert,eq}));
        }
        await test('existing settings UI renders and routes instant saves through correct scopes',async()=>{
            st.currentMessages=[];st.currentChatId=null;st.currentExecutionApiConfig=null;
            app.startNewChat();await st.executionSettingsReady;
            Object.assign(ui,realUi);ui.renderChatMessages=()=>{};ui.showCustomAlert=async message=>{throw new Error(message)};
            ui.applySettingsToUI();app.setupEventListeners();
            el.temperatureInput.value='0.7';el.temperatureInput.dispatchEvent(new Event('input'));
            await new Promise(r=>setTimeout(r,25));eq((await db.getProfile(st.activeProfileId)).settings.temperature,0.7);
            el.includeThoughtsToggle.checked=false;el.includeThoughtsToggle.dispatchEvent(new Event('change'));
            await new Promise(r=>setTimeout(r,25));eq((await db.getSetting('globalSettingsV136')).value.showThoughtProcess,false);
            const ref={apiConfigId:'gem',modelName:'gemini-3-flash-preview'};
            el.modelNameSelect.value=app.encodeModelRefValue(ref);el.modelNameSelect.dispatchEvent(new Event('change'));
            await new Promise(r=>setTimeout(r,25));eq(app.getCurrentChatModelRef(),ref);
            assert(!(await db.getProfile(st.activeProfileId)).settings.defaultModelRef);
        });
        window.fetch=rawFetch;
        if (new URLSearchParams(location.search).has('ui')) {
            await window.runSettingsUiTestsV136({app,db,st,ui,el,realUi,realAppFunctions,test,assert,eq});
            await window.runSettingsAdjustmentsV136({app,db,st,ui,test,assert,eq});
            if(new URLSearchParams(location.search).has('review'))await window.runNSettingsUiV136({app,db,st,ui,test,assert,eq});
            if(new URLSearchParams(location.search).has('integration')){
                const integration=await window.runIntegrationIRegressionsV136();output.push(...integration.output);
                for(const failure of integration.failures)output.push(failure.error);
            }
        }
        if(new URLSearchParams(location.search).has('j')){
            const j=await window.runIntegrationJRegressionsV136();output.push(...j.output);
            for(const failure of j.failures)output.push(failure.error);
        }
        await window.runChatTitleGenerationTests({app,db,st,ui,el,test,assert,eq});
        await window.runStreamingBrowserTestsV136({app,db,st,ui,el,test,assert,eq});
        const stage = Number(new URLSearchParams(location.search).get('fixes-stage'));
        await window.runReviewFixesV136({app,db,st,ui,el,test,assert,eq,stage});
        if(!output.some(line=>line.startsWith('FAIL')))output.push('ALL PASSED ('+output.length+' browser tests)');
    } catch(error) {output.push('FAIL '+(document.documentElement.dataset.testStatus || '')+' '+(error.stack || String(error)));}
    const preview=new URLSearchParams(location.search).has('ui');
    if(!preview)document.body.innerHTML='';
    const pre=document.createElement('pre');pre.id='test-results';pre.hidden=preview;pre.textContent=output.join('\n');document.body.append(pre);
});
